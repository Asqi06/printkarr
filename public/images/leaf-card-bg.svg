<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <radialGradient id="foliageBase" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="50%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#081c15"/>
    </radialGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40916c"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="leafGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95d5b2"/>
      <stop offset="100%" stop-color="#40916c"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Deep Forest Background -->
  <rect width="800" height="500" fill="url(#foliageBase)"/>

  <!-- Sunlit Glints -->
  <g opacity="0.3" filter="url(#softGlow)">
    <circle cx="200" cy="120" r="140" fill="#b7e4c7"/>
    <circle cx="650" cy="80" r="160" fill="#d8f3dc"/>
  </g>

  <!-- Background Layer Leaf Clusters -->
  <g opacity="0.7">
    <ellipse cx="120" cy="80" rx="95" ry="70" fill="url(#leafGrad1)" transform="rotate(-25 120 80)"/>
    <ellipse cx="280" cy="60" rx="110" ry="80" fill="url(#leafGrad1)" transform="rotate(15 280 60)"/>
    <ellipse cx="460" cy="90" rx="100" ry="75" fill="url(#leafGrad1)" transform="rotate(-10 460 90)"/>
    <ellipse cx="640" cy="70" rx="120" ry="85" fill="url(#leafGrad1)" transform="rotate(30 640 70)"/>
    <ellipse cx="760" cy="180" rx="90" ry="70" fill="url(#leafGrad1)" transform="rotate(-40 760 180)"/>
    <ellipse cx="80" cy="220" rx="105" ry="75" fill="url(#leafGrad1)" transform="rotate(20 80 220)"/>
  </g>

  <!-- Foreground Crisp Botanical Leaves Pattern -->
  <g>
    <!-- Left Top Pattern -->
    <path d="M40,50 Q100,20 130,70 Q70,100 40,50 Z" fill="url(#leafGrad2)"/>
    <path d="M120,40 Q180,25 200,80 Q140,95 120,40 Z" fill="url(#leafGrad3)"/>
    <path d="M80,95 Q145,100 160,150 Q95,145 80,95 Z" fill="url(#leafGrad1)"/>
    <path d="M170,90 Q230,80 255,130 Q195,140 170,90 Z" fill="url(#leafGrad2)"/>

    <!-- Center Top Pattern -->
    <path d="M260,30 Q330,15 360,65 Q290,80 260,30 Z" fill="url(#leafGrad2)"/>
    <path d="M350,45 Q420,35 440,90 Q370,100 350,45 Z" fill="url(#leafGrad3)"/>
    <path d="M300,95 Q370,105 385,160 Q315,150 300,95 Z" fill="url(#leafGrad1)"/>
    <path d="M400,100 Q470,85 500,140 Q430,155 400,100 Z" fill="url(#leafGrad2)"/>

    <!-- Right Top Pattern -->
    <path d="M510,40 Q580,20 610,75 Q540,95 510,40 Z" fill="url(#leafGrad2)"/>
    <path d="M600,30 Q670,25 700,80 Q630,85 600,30 Z" fill="url(#leafGrad3)"/>
    <path d="M550,110 Q620,105 640,165 Q570,170 550,110 Z" fill="url(#leafGrad1)"/>
    <path d="M650,90 Q725,85 750,145 Q675,150 650,90 Z" fill="url(#leafGrad2)"/>

    <!-- Mid Layer Accents -->
    <path d="M50,180 Q120,160 150,220 Q80,240 50,180 Z" fill="url(#leafGrad2)"/>
    <path d="M190,170 Q260,185 275,245 Q205,230 190,170 Z" fill="url(#leafGrad3)"/>
    <path d="M680,180 Q750,170 770,230 Q700,240 680,180 Z" fill="url(#leafGrad2)"/>
  </g>

  <!-- Gentle vignette for seamless card placement -->
  <rect width="800" height="500" fill="url(#foliageBase)" opacity="0.35"/>
</svg>
