<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <radialGradient id="mintHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bbf2c4"/>
      <stop offset="70%" stop-color="#c6f6cf"/>
      <stop offset="100%" stop-color="#dbfde2" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8cfb4"/>
      <stop offset="60%" stop-color="#e8b496"/>
      <stop offset="100%" stop-color="#c98a68"/>
    </linearGradient>
    <linearGradient id="hairDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222326"/>
      <stop offset="100%" stop-color="#0c0d0e"/>
    </linearGradient>
    <linearGradient id="turtleneckDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202226"/>
      <stop offset="50%" stop-color="#141517"/>
      <stop offset="100%" stop-color="#090a0b"/>
    </linearGradient>
    <linearGradient id="boundDocument" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f1f3f5"/>
      <stop offset="100%" stop-color="#e2e6ea"/>
    </linearGradient>
    <linearGradient id="warmSunlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8d6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softFaceShadow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Large Mint Halo Spotlight Circle -->
  <circle cx="300" cy="330" r="230" fill="url(#mintHalo)"/>

  <!-- Bust / Shoulders in chic dark turtleneck -->
  <g id="figure">
    <!-- Back Neck & Upper Back -->
    <path d="M190,470 Q205,370 240,320 L270,320 Q240,390 230,470 Z" fill="#141517"/>

    <!-- Dark high collar / Turtleneck base -->
    <path d="M160,540 C170,430 220,380 270,375 C320,380 370,430 380,540 C385,610 390,690 390,700 L150,700 C150,690 155,610 160,540 Z" fill="url(#turtleneckDark)"/>

    <!-- Neck & Throat -->
    <path d="M250,290 C245,340 250,385 270,395 C295,385 305,340 305,290 Z" fill="url(#skinTone)"/>

    <!-- Neck Shadow under Jaw -->
    <path d="M255,295 C265,335 285,345 300,320 C290,305 275,298 255,295 Z" fill="#b87856" opacity="0.45"/>

    <!-- Head & Jaw Contour (Profile looking slightly left, poised) -->
    <path d="M220,230 C215,250 220,270 235,285 C250,300 275,302 295,290 C315,275 320,240 315,200 C310,160 290,135 255,140 C230,145 220,175 220,230 Z" fill="url(#skinTone)"/>

    <!-- Facial features: Ear, jawline, lips, nose, brow -->
    <!-- Ear -->
    <path d="M290,225 C298,220 305,230 302,245 C300,258 292,260 288,252 Z" fill="#e8b496"/>
    <path d="M292,232 C296,230 299,235 298,242 C296,248 293,248 292,244 Z" fill="#c98a68"/>

    <!-- Nose & Profile line -->
    <path d="M225,210 Q215,225 218,232 Q225,235 230,232" fill="none" stroke="#b87856" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Lip contour (Warm red-coral) -->
    <path d="M223,250 Q232,253 236,251" fill="none" stroke="#c04b4b" stroke-width="3" stroke-linecap="round"/>
    <path d="M224,256 Q232,260 236,255" fill="none" stroke="#aa3b3b" stroke-width="2" stroke-linecap="round"/>

    <!-- Eye & Brow -->
    <path d="M224,198 Q234,193 244,196" fill="none" stroke="#1f2022" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="233" cy="206" rx="4" ry="2.5" fill="#18191a"/>

    <!-- Modern Bob Haircut (Sleek dark hair, side parted) -->
    <path d="M220,180 C215,145 235,115 270,110 C315,105 345,135 345,185 C345,235 335,275 315,295 C300,305 285,280 290,250 C295,220 280,185 260,170 C240,158 225,160 220,180 Z" fill="url(#hairDark)"/>
    <!-- Hair soft front fringe -->
    <path d="M245,120 C230,135 220,165 218,195 C225,185 240,175 255,160 Z" fill="#2d2f33"/>

    <!-- High-GSM Crisp Printed Portfolio Held Forward -->
    <!-- Spiral bound booklet / print presentation -->
    <g transform="translate(190, 480) rotate(-6)">
      <!-- Drop Shadow -->
      <rect x="5" y="8" width="180" height="230" rx="8" fill="#000000" opacity="0.18" filter="url(#softFaceShadow)"/>
      <!-- Folder Body -->
      <rect x="0" y="0" width="180" height="230" rx="8" fill="url(#boundDocument)" stroke="#d0d5dd" stroke-width="1.5"/>

      <!-- Spiral Binding Edge on the Left -->
      <rect x="0" y="0" width="18" height="230" rx="4" fill="#2d3748"/>
      <!-- Metallic spiral wire coils -->
      <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
        <line x1="4" y1="20" x2="16" y2="28"/>
        <line x1="4" y1="45" x2="16" y2="53"/>
        <line x1="4" y1="70" x2="16" y2="78"/>
        <line x1="4" y1="95" x2="16" y2="103"/>
        <line x1="4" y1="120" x2="16" y2="128"/>
        <line x1="4" y1="145" x2="16" y2="153"/>
        <line x1="4" y1="170" x2="16" y2="178"/>
        <line x1="4" y1="195" x2="16" y2="203"/>
      </g>

      <!-- Document Cover Content -->
      <rect x="32" y="30" width="45" height="10" rx="3" fill="#e8590c"/>
      <rect x="32" y="55" width="120" height="12" rx="3" fill="#1e3f20"/>
      <rect x="32" y="75" width="90" height="8" rx="2" fill="#52b788"/>
      <line x1="32" y1="105" x2="150" y2="105" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="32" y="125" width="110" height="6" rx="2" fill="#94a3b8"/>
      <rect x="32" y="140" width="85" height="6" rx="2" fill="#cbd5e1"/>
      <rect x="32" y="155" width="100" height="6" rx="2" fill="#cbd5e1"/>

      <!-- Verified Stamp Badge -->
      <circle cx="140" cy="190" r="18" fill="#1b4332"/>
      <path d="M133,190 L138,195 L148,185" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
